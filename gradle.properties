# Project-wide Gradle settings.
# IDE (e.g. Android Studio) users:
# Gradle settings configured through the IDE *will override*
# any settings specified in this file.
# For more details on how to configure your build environment visit
# http://www.gradle.org/docs/current/userguide/build_environment.html
# Specifies the JVM arguments used for the daemon process.
# The setting is particularly useful for tweaking memory settings.
# Optimized for 64GB RAM, 10 threads
org.gradle.jvmargs=-Xms4096m -Xmx16384m -Dfile.encoding=UTF-8 -XX:+UseParallelGC -XX:MaxMetaspaceSize=2048m -XX:+HeapDumpOnOutOfMemoryError -XX:ReservedCodeCacheSize=512m -XX:+UseCompressedOops --enable-native-access=ALL-UNNAMED
# When configured, Gradle will run in incubating parallel mode.
# This option should only be used with decoupled projects. For more details, visit
# https://developer.android.com/r/tools/gradle-multi-project-decoupled-projects
org.gradle.parallel=true
org.gradle.workers.max=10
# AndroidX package structure to make it clearer which packages are bundled with the
# Android operating system, and which are packaged with your app's APK
# https://developer.android.com/topic/libraries/support-library/androidx-rn
android.useAndroidX=true
# Kotlin code style for this project: "official" or "obsolete":
kotlin.code.style=official
# Enables namespacing of each library's R class so that its R class includes only the
# resources declared in the library itself and none from the library's dependencies,
# thereby reducing the size of the R class for that library
android.nonTransitiveRClass=true
# Accelerate the dexBuilder phase (default false)
# androidAop.fastDex=true
# Only works in debug (default false)
# androidAop.fastDex.variantOnlyDebug=false

# Gradle performance optimizations
org.gradle.caching=true
org.gradle.daemon=true
org.gradle.configureondemand=true
org.gradle.vfs.watch=true
org.gradle.unsafe.watch-fs=true
org.gradle.file-watch.active=true

# Kotlin compiler optimizations
kotlin.incremental=true
kotlin.incremental.java=true
kotlin.incremental.js=false
kotlin.caching.enabled=true
kotlin.parallel.tasks.in.project=true
# Kotlin daemon memory (optimized for 64GB RAM)
kotlin.daemon.jvmargs=-Xms2048m -Xmx8192m -XX:MaxMetaspaceSize=1024m -XX:ReservedCodeCacheSize=512m

# KSP optimizations
ksp.incremental=true
ksp.incremental.log=false
ksp.use.k2=false

# Android build optimizations
android.enableJetifier=false
android.enableR8.fullMode=true
# Optimize resource compilation
android.enableResourceOptimizations=true
# Use full classpath for dexing if needed
android.useFullClasspathForDexingTransform=false

# Configuration cache (experimental but fast)
org.gradle.configuration-cache=true
org.gradle.configuration-cache.problems=warn